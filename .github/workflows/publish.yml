# Publishes the extension to the VS Code Marketplace and Open VSX from a
# version tag:
#
#   git tag v1.12.0 && git push origin v1.12.0
#
# No registry token is stored. Each publish job asks GitHub for an OIDC token
# and exchanges it for a short-lived publishing token (trusted publishing):
# `vsce publish --oidc` and `ovsx publish --trusted-publishing`. Each registry
# only accepts the exchange if its trusted-publisher policy names this repo,
# this workflow file (publish.yml) and the environment `release`. Renaming
# either one breaks publishing until the policies are updated. Setup is in
# DEVELOPING.md under "Publishing".
#
# Both registries get the same .vsix, built once by the package job.

name: Publish

on:
  push:
    tags: ["v*"]
  # A manual run builds and packages only, to check a release would go
  # through. It publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

# Never run two publishes of the same ref at once, and never cancel one that
# has started: a half-finished publish is worse than a queued one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: build + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint -- --max-warnings=0

      # A tag that disagrees with package.json means one of them was forgotten.
      # vsce takes the version from the manifest, so a mismatched tag would
      # publish some other version under its name.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, package.json says $version"
            exit 1
          fi

      # pretest runs `npm run compile`, which copies the viewer out of the
      # gds-lens version package-lock.json pins.
      - run: npm test

      - name: Package
        id: pack
        run: |
          vsix="GDS-Lens-$(npm pkg get version | tr -d '"').vsix"
          npx @vscode/vsce@4.1.0 package -o "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pack.outputs.vsix }}
          if-no-files-found: error

  marketplace:
    name: publish to VS Code Marketplace
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npx @vscode/vsce@4.1.0 publish --oidc --packagePath "${{ needs.package.outputs.vsix }}"

  open-vsx:
    name: publish to Open VSX
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npx ovsx@1.3.0 publish --trusted-publishing "${{ needs.package.outputs.vsix }}"
