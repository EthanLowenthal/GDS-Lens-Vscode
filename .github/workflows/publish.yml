# Publishes the extension to the VS Code Marketplace from a version tag.
#
#   git tag v1.10.0 && git push origin v1.10.0
#
# Authentication is Microsoft Entra ID, not a personal access token: Azure
# DevOps retires global PATs on 2026-12-01, and `vsce publish --oidc` fails
# until the Marketplace ships the trusted-publishing policy page it needs. The
# job signs in to Azure as a user-assigned managed identity through GitHub's
# OIDC token (azure/login), and vsce exchanges that sign-in for Marketplace
# access (--azure-credential). No Marketplace secret is stored anywhere. Setup
# is in DEVELOPING.md under "Publishing".
#
# Two things this file cannot enforce:
#
#   * The managed identity's federated credential names the GitHub
#     environment `marketplace-publish`. Renaming the environment below breaks
#     the Azure sign-in.
#   * The identity must be a Contributor on the `ethml` publisher, added by its
#     Azure DevOps profile ID. A manual run prints that ID.

name: Publish

on:
  push:
    tags: ["v*"]
  # A manual run defaults to a dry run: it builds and packages, signs in, and
  # checks the identity can publish to `ethml`, but publishes nothing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify access, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: build + package
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # A tag that disagrees with package.json means one of them was forgotten.
      # vsce takes the version from the manifest, so a mismatched tag would
      # publish some other version under its name.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, package.json says $version"
            exit 1
          fi

      # vscode:prepublish runs `npm run compile`, which copies the viewer out
      # of the gds-lens version package-lock.json pins.
      - name: Package
        id: pack
        run: |
          vsix="GDS-Lens-$(npm pkg get version | tr -d '"').vsix"
          npx @vscode/vsce@4.0.0 package -o "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pack.outputs.vsix }}
          if-no-files-found: error

  marketplace:
    name: publish to VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      # The OIDC token azure/login signs in with.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # allow-no-subscriptions: the identity needs no role on any Azure
      # resource, only membership of the Marketplace publisher.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The ID the Marketplace's Members page wants for this identity. It is
      # neither the client ID nor the Entra object ID, and the portal does not
      # show it anywhere.
      - name: Print the identity's Azure DevOps ID
        if: github.event_name == 'workflow_dispatch'
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: Verify publish access
        run: npx @vscode/vsce@4.0.0 verify-pat ethml --azure-credential

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npx @vscode/vsce@4.0.0 publish --packagePath "${{ needs.package.outputs.vsix }}" --azure-credential
